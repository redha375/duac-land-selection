name: Android field beta release

on:
  push:
    tags:
      - 'v2.*-field-blank-beta'
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing field-beta tag to rebuild for verification (artifact only)'
        required: true
        default: 'v2.3.0-field-blank-beta'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag points at this exact source commit
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$REQUESTED_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          test "$RELEASE_TAG" = "v2.3.0-field-blank-beta"
          SOURCE_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          fi
      - name: Verify blank-field source and JavaScript syntax
        run: python3 scripts/verify_field_source.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install only packages used by compileSdk 35; the legacy `tools`
          # package is no longer published by Google's SDK repository.
          packages: |-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK from the tag
        env:
          SOURCE_COMMIT: ${{ env.SOURCE_COMMIT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ./android/gradlew -p android clean assembleRelease \
            -PsourceCommit="$SOURCE_COMMIT" -PreleaseTag="$RELEASE_TAG"
      - name: Verify package, version and embedded provenance
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='dz.medea.parcel.fieldbeta230' versionCode='3' versionName='2.3.0-field-blank-beta'" <<<"$BADGING"
          unzip -p "$APK" assets/build-info.json > build-info.json
          grep -F '"sourceCommit": "'"$SOURCE_COMMIT"'"' build-info.json
          grep -F '"releaseTag": "'"$RELEASE_TAG"'"' build-info.json
          python3 scripts/verify_field_apk.py --apk "$APK" --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
          cp "$APK" el-taamir-field-blank-beta-2.3.0.apk
          sha256sum el-taamir-field-blank-beta-2.3.0.apk | tee el-taamir-field-blank-beta-2.3.0.apk.sha256
      - name: Publish the verified APK and checksum
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: 'التعمير — نسخة ميدانية فارغة 2.3.0'
          prerelease: true
          files: |
            el-taamir-field-blank-beta-2.3.0.apk
            el-taamir-field-blank-beta-2.3.0.apk.sha256

      - name: Store verification build without touching any release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: field-beta-v2.3.0-field-blank-beta-verification
          path: |
            el-taamir-field-blank-beta-2.3.0.apk
            el-taamir-field-blank-beta-2.3.0.apk.sha256
            build-info.json
          if-no-files-found: error
          retention-days: 14
